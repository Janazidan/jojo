<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>قبل ما تغادر | رفيق</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/after-visit.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>


<body class="inner-page after-visit-final-page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header rafiq-inner-header">

    <a
        href="index.html"
        class="inner-brand"
        aria-label="الصفحة الرئيسية"
    >
        <img
            src="assets/logo.png"
            alt="رفيق"
            class="header-logo"
        >
    </a>


    <div class="header-tools">

        <button
            type="button"
            class="simple-btn sound-btn header-icon-btn"
            aria-label="قراءة الصفحة بصوت مرتفع"
        >
            <i class="fa-solid fa-volume-high"></i>
            <span>الصوت</span>
        </button>


        <a
            href="problem.html#translation-section"
            class="simple-btn header-icon-btn"
            aria-label="ترجمة لافتة"
        >
            <i class="fa-solid fa-camera"></i>
            <span>ترجمة</span>
        </a>


        <a
            href="services.html"
            class="simple-btn header-icon-btn"
            aria-label="الخدمات القريبة"
        >
            <i class="fa-solid fa-location-dot"></i>
            <span>خدمات</span>
        </a>

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="setup-page after-visit-main">

    <section class="setup-content after-visit-content">


        <!-- Back -->

        <div class="after-visit-top-actions">

            <a
                href="hospital-guide.html"
                class="clear-back-link"
            >
                <i class="fa-solid fa-arrow-right"></i>

                <span>
                    إرشادات المستشفى
                </span>
            </a>

        </div>



        <!-- =================================================
             STAGE
        ================================================== -->

        <div class="after-visit-stage-label">

            <div class="after-visit-stage-icon">

                <i class="fa-solid fa-flag-checkered"></i>

            </div>


            <div>

                <span>
                    المرحلة الرابعة
                </span>

                <strong>
                    بعد الزيارة
                </strong>

            </div>

        </div>



        <!-- =================================================
             HEADING
        ================================================== -->

        <div class="after-visit-heading">

            <h1>
                خلصت زيارتك؟
            </h1>

            <p>
                قبل ما تغادر المستشفى،
                خلينا نتأكد إنك ما نسيت شيء مهم.
            </p>

        </div>



        <!-- =================================================
             PROGRESS
        ================================================== -->

        <div
            class="progress after-visit-progress"
            aria-label="مراحل الرحلة"
        >

            <div class="progress-step completed">

                <span>
                    <i class="fa-solid fa-check"></i>
                </span>

                <p>الاستعداد</p>

            </div>


            <div class="progress-step completed">

                <span>
                    <i class="fa-solid fa-check"></i>
                </span>

                <p>الطريق</p>

            </div>


            <div class="progress-step completed">

                <span>
                    <i class="fa-solid fa-check"></i>
                </span>

                <p>المستشفى</p>

            </div>


            <div class="progress-step active">

                <span>4</span>

                <p>بعد الزيارة</p>

            </div>

        </div>



        <!-- =================================================
             BEFORE LEAVING
        ================================================== -->

        <div class="before-leaving-final">


            <div class="before-leaving-title">

                <span class="before-leaving-icon">

                    <i class="fa-solid fa-clipboard-check"></i>

                </span>


                <div>

                    <span class="card-label">
                        قبل ما تطلع
                    </span>

                    <h2>
                        تأكد من هالشغلتين
                    </h2>

                </div>

            </div>



            <div class="before-leaving">


                <!-- Documents -->

                <label class="check-card leaving-card-final">

                    <input
                        type="checkbox"
                        class="leaving-check"
                    >


                    <span class="leaving-card-icon">

                        <i class="fa-regular fa-folder-open"></i>

                    </span>


                    <span class="leaving-card-text">

                        <strong>
                            أخذت أوراقي ومتعلقاتي
                        </strong>

                        <small>
                            تأكد إن أوراقك وأغراضك الشخصية معك.
                        </small>

                    </span>


                    <span class="leaving-check-state">

                        <i class="fa-solid fa-check"></i>

                    </span>

                </label>



                <!-- Instructions -->

                <label class="check-card leaving-card-final">

                    <input
                        type="checkbox"
                        class="leaving-check"
                    >


                    <span class="leaving-card-icon">

                        <i class="fa-solid fa-list-check"></i>

                    </span>


                    <span class="leaving-card-text">

                        <strong>
                            فهمت تعليمات ما بعد الزيارة
                        </strong>

                        <small>
                            تأكد إنك عرفت إذا في خطوة مطلوبة منك بعد الزيارة.
                        </small>

                    </span>


                    <span class="leaving-check-state">

                        <i class="fa-solid fa-check"></i>

                    </span>

                </label>


            </div>

        </div>



        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div
            id="check-message"
            class="after-visit-check-message"
            aria-live="polite"
        ></div>



        <!-- =================================================
             CONTINUE
        ================================================== -->

        <button
            type="button"
            id="continue-btn"
            class="primary-btn after-visit-continue-btn"
        >

            <span>
                تأكدت، كمل
            </span>

            <i class="fa-solid fa-arrow-left"></i>

        </button>



        <div class="after-visit-help-note">

            <i class="fa-solid fa-circle-info"></i>

            <span>
                الخطوة الجاية بتساعدك ترتب المتابعة والعودة.
            </span>

        </div>


    </section>

</main>



<!-- =====================================================
     SCRIPTS
===================================================== -->

<script src="js/accessibility.js"></script>
<script src="js/after-visit.js"></script>


<script>

    localStorage.setItem(
        "rafiqCurrentPage",
        "visit-complete.html"
    );

</script>


</body>
</html>
